<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  .page-head { padding-block: 56px 32px; }
  .page-head h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(1.9rem, 4.5vw, 2.6rem);
    margin: 0 0 8px;
  }
  .page-head p { color: var(--ink-soft); margin: 0; max-width: 60ch; }

  .view-all { font-family: var(--mono); font-size: 13px; }

  .post-card { padding-block: 28px; border-top: 1px solid var(--line); }
  .post-card:first-of-type { border-top: none; padding-top: 0; }
  .post-card .post-date {
    font-family: var(--mono);
    font-size: 12.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 8px;
  }
  .post-card h2 {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 600;
    margin: 0 0 10px;
  }
  .post-card h2 a { color: var(--ink); text-decoration: none; }
  .post-card h2 a:hover { color: var(--accent-ink); }
  .post-card .summary { color: var(--ink-soft); max-width: 66ch; margin: 0; }
  .empty { color: var(--ink-faint); font-size: 14px; }

  .new-post-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 640px;
  }
  .new-post-form label {
    display: block;
    font-family: var(--mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-faint);
    margin-bottom: 6px;
  }
  .new-post-form input,
  .new-post-form textarea {
    width: 100%;
    padding: 10px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14.5px;
    box-sizing: border-box;
  }
  .new-post-form textarea { min-height: 140px; resize: vertical; }
  .form-error { color: #c0392b; font-size: 13.5px; margin: 0; min-height: 1em; }
</style>

<header class="page-head wrap">
  <h1>Blogs</h1>
  <p>Notes on whatever I'm reading, building, or thinking about lately — engineering, leadership, or otherwise.</p>
</header>

<section class="wrap" style="padding-top: 0;">
  <div style="display:flex; justify-content:space-between; align-items:baseline; gap: 16px; flex-wrap: wrap;">
    <p class="eyebrow" style="margin-bottom: 0;">Latest posts</p>
    <a class="view-all" href="all-posts.html">View all posts →</a>
  </div>
  <div id="post-list" style="margin-top: 18px;">
    <p class="empty">Loading…</p>
  </div>
</section>

<section class="wrap">
  <p class="eyebrow">Write a new post</p>
  <form class="new-post-form" id="new-post-form">
    <div>
      <label for="title">Title</label>
      <input type="text" id="title" required>
    </div>
    <div>
      <label for="content">Content</label>
      <textarea id="content" required></textarea>
    </div>
    <div>
      <button type="submit" class="btn btn-primary">Publish</button>
    </div>
    <p class="form-error" id="form-error"></p>
    <div id="publish-auth-gate"></div>
  </form>
</section>

<footer>
  <div class="wrap">Dhaval Patel · Central Jersey</div>
</footer>

<script defer src="/_vercel/insights/script.js"></script>
<script src="auth.js"></script>
<script>
  const postList = document.getElementById('post-list');
  const form = document.getElementById('new-post-form');
  const attemptPublish = initAuthGate(document.getElementById('publish-auth-gate'));
  const titleInput = document.getElementById('title');
  const contentInput = document.getElementById('content');
  const errorEl = document.getElementById('form-error');

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function summarize(content) {
    const trimmed = content.trim();
    return trimmed.length > 100 ? trimmed.slice(0, 100).trim() + '…' : trimmed;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function loadPosts() {
    const res = await fetch('/api/blog-posts');
    if (!res.ok) {
      postList.innerHTML = '<p class="empty">Could not load posts.</p>';
      return;
    }
    const posts = await res.json();
    const top5 = posts.slice(0, 5);

    postList.innerHTML = top5.length
      ? top5
          .map(
            (p) => `
      <article class="post-card">
        <p class="post-date">${formatDate(p.updated_at)}</p>
        <h2><a href="post.html?id=${p.id}">${escapeHtml(p.title)}</a></h2>
        <p class="summary">${escapeHtml(summarize(p.content))}</p>
      </article>`
          )
          .join('')
      : '<p class="empty">No posts yet — write the first one below.</p>';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';

    if (!titleInput.value.trim() || !contentInput.value.trim()) {
      errorEl.textContent = 'Title and content are required.';
      return;
    }

    const res = await attemptPublish(() => fetch('/api/blog-posts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: titleInput.value.trim(), content: contentInput.value.trim() }),
    }));

    if (!res.ok) {
      errorEl.textContent = 'Could not publish that post.';
      return;
    }

    form.reset();
    loadPosts();
  });

  loadPosts();
</script>
</body>
</html>
