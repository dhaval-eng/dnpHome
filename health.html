<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health — Dhaval Patel</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .page-head { padding-block: 56px 24px; }
  .page-head h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(1.9rem, 4.5vw, 2.6rem);
    margin: 0 0 8px;
  }
  .page-head p { color: var(--ink-soft); margin: 0; max-width: 60ch; }

  .week-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }
  .week-nav h2 {
    font-family: var(--serif);
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0;
    text-align: center;
  }

  .health-list { display: flex; flex-direction: column; }
  .health-row {
    display: grid;
    grid-template-columns: 110px 90px 1fr 50px 28px;
    gap: 12px;
    align-items: center;
    padding-block: 10px;
    border-bottom: 1px solid var(--line);
    font-size: 14.5px;
  }
  .health-date { font-family: var(--mono); font-size: 12.5px; color: var(--ink-faint); }
  .health-duration { font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  .health-desc { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .health-edit-btn {
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 13px;
    font-family: var(--mono);
    padding: 4px;
    text-align: left;
  }
  .health-edit-btn:hover { color: var(--accent-ink); }
  .health-delete {
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 15px;
    padding: 4px;
  }
  .health-delete:hover { color: #c0392b; }
  @media (max-width: 700px) {
    .health-row { grid-template-columns: 1fr 1fr; grid-template-areas: "date dur" "desc desc" "edit del"; row-gap: 6px; }
    .health-date { grid-area: date; }
    .health-duration { grid-area: dur; }
    .health-desc { grid-area: desc; white-space: normal; }
    .health-edit-btn { grid-area: edit; }
    .health-delete { grid-area: del; text-align: right; }
  }

  .health-edit-row {
    display: grid;
    grid-template-columns: 130px 110px 1fr auto;
    gap: 10px;
    align-items: center;
    padding-block: 10px;
    border-bottom: 1px solid var(--line);
  }
  .health-edit-row input {
    width: 100%;
    padding: 8px 9px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    box-sizing: border-box;
  }
  .health-edit-actions { display: flex; gap: 6px; }
  @media (max-width: 700px) {
    .health-edit-row { grid-template-columns: 1fr 1fr; grid-template-areas: "date dur" "desc desc" "actions actions"; row-gap: 8px; }
    .health-edit-actions { grid-area: actions; }
  }

  .add-form {
    display: grid;
    grid-template-columns: 140px 120px 1fr auto;
    gap: 12px;
    align-items: end;
  }
  .add-form label {
    display: block;
    font-family: var(--mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-faint);
    margin-bottom: 6px;
  }
  .add-form input {
    width: 100%;
    padding: 9px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14.5px;
    box-sizing: border-box;
  }
  @media (max-width: 700px) {
    .add-form { grid-template-columns: 1fr 1fr; }
  }
  .empty { color: var(--ink-faint); font-size: 14px; }
</style>

<div id="site-nav"></div>
<script src="nav.js" data-active="health.html"></script>

<header class="page-head wrap">
  <h1>Health</h1>
  <p>A log of workouts — what, when, and for how long.</p>
</header>

<section class="wrap" style="padding-top: 0;">
  <div class="week-nav">
    <button type="button" class="btn btn-ghost" id="prev-week">← Previous week</button>
    <h2 id="week-label"></h2>
    <button type="button" class="btn btn-ghost" id="next-week">Next week →</button>
  </div>
  <div class="health-list" id="health-list">
    <p class="empty">Loading…</p>
  </div>
</section>

<section class="wrap">
  <p class="eyebrow">Log a workout</p>
  <form class="add-form" id="add-form">
    <div>
      <label for="add-date">Date</label>
      <input type="date" id="add-date" required>
    </div>
    <div>
      <label for="add-duration">Minutes</label>
      <input type="number" id="add-duration" min="1" step="1" required>
    </div>
    <div>
      <label for="add-description">Class / exercise(s)</label>
      <input type="text" id="add-description" placeholder="e.g. 5k run, upper body strength" required>
    </div>
    <div>
      <button type="submit" class="btn btn-primary">Add</button>
    </div>
  </form>
  <p class="form-error" id="form-error"></p>
</section>

<footer>
  <div class="wrap">Dhaval Patel · Central Jersey</div>
</footer>

<script defer src="/_vercel/insights/script.js"></script>
<script>
  const listEl = document.getElementById('health-list');
  const weekLabel = document.getElementById('week-label');
  const addForm = document.getElementById('add-form');
  const addDate = document.getElementById('add-date');
  const addDuration = document.getElementById('add-duration');
  const addDescription = document.getElementById('add-description');
  const formError = document.getElementById('form-error');

  let allRecords = [];
  let weekStart = startOfWeek(new Date());

  function startOfWeek(date) {
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const day = d.getDay(); // 0 = Sunday ... 6 = Saturday
    const diff = day === 0 ? -6 : 1 - day; // shift back to Monday
    d.setDate(d.getDate() + diff);
    return d;
  }

  function addDays(date, days) {
    const d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
  }

  function toDateString(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function parseLocalDate(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function formatShort(date) {
    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function formatLong(date) {
    return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function loadAll() {
    const res = await fetch('/api/health-log');
    if (!res.ok) {
      listEl.innerHTML = '<p class="empty">Could not load workouts.</p>';
      return;
    }
    allRecords = await res.json();
    renderWeek();
  }

  function renderWeek() {
    const weekEnd = addDays(weekStart, 6);
    const startStr = toDateString(weekStart);
    const endStr = toDateString(weekEnd);

    weekLabel.textContent = `Week of ${formatShort(weekStart)} – ${formatLong(weekEnd)}`;

    const weekRecords = allRecords
      .filter((r) => r.date >= startStr && r.date <= endStr)
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id));

    if (weekRecords.length === 0) {
      listEl.innerHTML = '<p class="empty">No workouts logged this week yet — add one below.</p>';
      return;
    }

    listEl.innerHTML = '';
    weekRecords.forEach((record) => listEl.appendChild(renderRow(record)));
  }

  function renderRow(record) {
    const row = document.createElement('div');
    row.className = 'health-row';
    row.dataset.id = record.id;
    row.innerHTML = `
      <span class="health-date">${formatShort(parseLocalDate(record.date))}</span>
      <span class="health-duration">${record.duration_minutes} min</span>
      <span class="health-desc">${escapeHtml(record.description)}</span>
      <button type="button" class="health-edit-btn">Edit</button>
      <button type="button" class="health-delete" title="Delete">✕</button>
    `;

    row.querySelector('.health-edit-btn').addEventListener('click', () => {
      row.replaceWith(renderEditRow(record));
    });

    row.querySelector('.health-delete').addEventListener('click', async () => {
      const res = await fetch(`/api/health-log?id=${record.id}`, { method: 'DELETE' });
      if (res.ok) loadAll();
    });

    return row;
  }

  function renderEditRow(record) {
    const row = document.createElement('div');
    row.className = 'health-edit-row';
    row.innerHTML = `
      <input type="date" class="edit-date" value="${record.date}" required>
      <input type="number" class="edit-duration" min="1" step="1" value="${record.duration_minutes}" required>
      <input type="text" class="edit-description" required>
      <div class="health-edit-actions">
        <button type="button" class="btn btn-primary edit-save">Save</button>
        <button type="button" class="btn btn-ghost edit-cancel">Cancel</button>
      </div>
    `;
    row.querySelector('.edit-description').value = record.description;

    row.querySelector('.edit-cancel').addEventListener('click', () => {
      row.replaceWith(renderRow(record));
    });

    row.querySelector('.edit-save').addEventListener('click', async () => {
      const date = row.querySelector('.edit-date').value;
      const duration_minutes = row.querySelector('.edit-duration').value;
      const description = row.querySelector('.edit-description').value.trim();

      if (!date || !duration_minutes || !description) return;

      const res = await fetch(`/api/health-log?id=${record.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date, duration_minutes, description }),
      });

      if (res.ok) loadAll();
    });

    return row;
  }

  document.getElementById('prev-week').addEventListener('click', () => {
    weekStart = addDays(weekStart, -7);
    renderWeek();
  });

  document.getElementById('next-week').addEventListener('click', () => {
    weekStart = addDays(weekStart, 7);
    renderWeek();
  });

  addDate.valueAsDate = new Date();

  addForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    formError.textContent = '';

    const date = addDate.value;
    const duration_minutes = addDuration.value;
    const description = addDescription.value.trim();

    if (!date || !duration_minutes || !description) {
      formError.textContent = 'Date, minutes, and a description are all required.';
      return;
    }

    const res = await fetch('/api/health-log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date, duration_minutes, description }),
    });

    if (!res.ok) {
      formError.textContent = 'Could not save that workout.';
      return;
    }

    addForm.reset();
    addDate.valueAsDate = new Date();
    loadAll();
  });

  loadAll();
</script>
</body>
</html>
