<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post — Dhaval Patel</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .page-head { padding-block: 56px 24px; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .back-link { font-family: var(--mono); font-size: 13px; }

  .post-meta {
    font-family: var(--mono);
    font-size: 12.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 10px;
  }
  .post-title {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(1.8rem, 4.5vw, 2.4rem);
    margin: 0 0 24px;
  }
  .post-content {
    color: var(--ink-soft);
    max-width: 68ch;
    white-space: pre-wrap;
    font-size: 16px;
  }
  .empty { color: var(--ink-faint); font-size: 14px; }

  .comments-section { padding-top: 0; }
  .comment { padding-block: 16px; border-top: 1px solid var(--line); }
  .comment:first-of-type { border-top: none; padding-top: 0; }
  .comment-meta { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); margin: 0 0 6px; }
  .comment-meta strong { color: var(--ink); font-family: var(--sans); font-weight: 600; }
  .comment-message { color: var(--ink-soft); white-space: pre-wrap; margin: 0; max-width: 66ch; }

  .comment-form { margin-top: 24px; max-width: 520px; }
  .comment-form input,
  .comment-form textarea {
    display: block;
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14.5px;
    box-sizing: border-box;
  }
  .comment-form textarea { min-height: 90px; resize: vertical; }
  .comment-form-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .char-count { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); }

  .edit-form input,
  .edit-form textarea {
    display: block;
    width: 100%;
    max-width: 68ch;
    padding: 10px;
    margin-bottom: 14px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink);
    font-family: inherit;
    font-size: 15px;
    box-sizing: border-box;
  }
  .edit-form input { font-family: var(--serif); font-size: 1.4rem; font-weight: 600; }
  .edit-form textarea { min-height: 260px; resize: vertical; }
  .edit-actions { display: flex; gap: 10px; }
  .form-error { color: #c0392b; font-size: 13.5px; margin: 10px 0 0; }
</style>

<div id="site-nav"></div>
<script src="nav.js" data-active="blogs.html"></script>

<header class="page-head wrap">
  <a class="back-link" href="blogs.html">← Back to Blogs</a>
  <button type="button" class="btn btn-ghost" id="edit-btn" hidden>Edit</button>
</header>

<main class="wrap" id="post-container">
  <p class="empty">Loading…</p>
</main>

<section class="wrap comments-section">
  <p class="eyebrow">Comments</p>
  <div id="comments-list">
    <p class="empty">Loading…</p>
  </div>
  <form class="comment-form" id="comment-form">
    <input type="text" id="comment-name" placeholder="Your name" maxlength="100" required>
    <textarea id="comment-message" placeholder="Add a comment…" maxlength="500" required></textarea>
    <div class="comment-form-footer">
      <span class="char-count" id="char-count">0/500</span>
      <button type="submit" class="btn btn-primary">Post comment</button>
    </div>
    <p class="form-error" id="comment-error"></p>
  </form>
</section>

<footer>
  <div class="wrap">Dhaval Patel · Central Jersey</div>
</footer>

<script defer src="/_vercel/insights/script.js"></script>
<script src="auth.js"></script>
<script>
  const container = document.getElementById('post-container');
  const editBtn = document.getElementById('edit-btn');

  let currentPost = null;

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function metaLineFor(post) {
    const createdLabel = formatDate(post.created_at);
    const editedLabel = formatDate(post.updated_at);
    return post.updated_at !== post.created_at
      ? `Posted ${createdLabel} · Last edited ${editedLabel}`
      : `Posted ${createdLabel}`;
  }

  function renderView(post) {
    document.title = `${post.title} — Dhaval Patel`;
    editBtn.hidden = false;

    container.innerHTML = '';
    const meta = document.createElement('p');
    meta.className = 'post-meta';
    meta.textContent = metaLineFor(post);

    const title = document.createElement('h1');
    title.className = 'post-title';
    title.textContent = post.title;

    const content = document.createElement('div');
    content.className = 'post-content';
    content.textContent = post.content;

    container.append(meta, title, content);
  }

  function renderEdit(post) {
    editBtn.hidden = true;
    container.innerHTML = `
      <form class="edit-form" id="edit-form">
        <input type="text" id="edit-title" required>
        <textarea id="edit-content" required></textarea>
        <div class="edit-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-ghost" id="cancel-edit">Cancel</button>
        </div>
        <p class="form-error" id="edit-error"></p>
        <div id="edit-auth-gate"></div>
      </form>
    `;
    document.getElementById('edit-title').value = post.title;
    document.getElementById('edit-content').value = post.content;

    const attemptSave = initAuthGate(document.getElementById('edit-auth-gate'));
    const errorEl = document.getElementById('edit-error');

    document.getElementById('cancel-edit').addEventListener('click', () => renderView(post));

    document.getElementById('edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';

      const title = document.getElementById('edit-title').value.trim();
      const content = document.getElementById('edit-content').value.trim();

      if (!title || !content) {
        errorEl.textContent = 'Title and content are required.';
        return;
      }

      const res = await attemptSave(() => fetch(`/api/blog-posts?id=${encodeURIComponent(post.id)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, content }),
      }));

      if (!res.ok) {
        errorEl.textContent = 'Could not save that post.';
        return;
      }

      currentPost = await res.json();
      renderView(currentPost);
    });
  }

  editBtn.addEventListener('click', () => renderEdit(currentPost));

  async function loadPost() {
    const id = new URLSearchParams(location.search).get('id');
    if (!id) {
      container.innerHTML = '<p class="empty">No post specified.</p>';
      return;
    }

    const res = await fetch(`/api/blog-posts?id=${encodeURIComponent(id)}`);
    if (!res.ok) {
      container.innerHTML = '<p class="empty">That post could not be found.</p>';
      return;
    }

    currentPost = await res.json();
    renderView(currentPost);
    loadComments(currentPost.id);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  const commentsList = document.getElementById('comments-list');
  const commentForm = document.getElementById('comment-form');
  const commentNameInput = document.getElementById('comment-name');
  const commentMessageInput = document.getElementById('comment-message');
  const commentError = document.getElementById('comment-error');
  const charCount = document.getElementById('char-count');

  commentMessageInput.addEventListener('input', () => {
    charCount.textContent = `${commentMessageInput.value.length}/500`;
  });

  async function loadComments(postId) {
    const res = await fetch(`/api/comments?post_id=${encodeURIComponent(postId)}`);
    if (!res.ok) {
      commentsList.innerHTML = '<p class="empty">Could not load comments.</p>';
      return;
    }
    const comments = await res.json();
    commentsList.innerHTML = comments.length
      ? comments
          .map(
            (c) => `
      <div class="comment">
        <p class="comment-meta">${formatDate(c.created_at)} · <strong>${escapeHtml(c.name)}</strong></p>
        <p class="comment-message">${escapeHtml(c.message)}</p>
      </div>`
          )
          .join('')
      : '<p class="empty">No comments yet — be the first.</p>';
  }

  commentForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    commentError.textContent = '';

    const name = commentNameInput.value.trim();
    const message = commentMessageInput.value.trim();

    if (!name || !message) {
      commentError.textContent = 'Name and comment are required.';
      return;
    }

    const res = await fetch('/api/comments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ post_id: currentPost.id, name, message }),
    });

    if (!res.ok) {
      commentError.textContent = 'Could not post that comment.';
      return;
    }

    commentForm.reset();
    charCount.textContent = '0/500';
    loadComments(currentPost.id);
  });

  loadPost();
</script>
</body>
</html>
